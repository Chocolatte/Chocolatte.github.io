<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-logo" href="{{ SITEURL }}/">
        <span class="logo-initials">ZK</span>
        <span class="logo-name">Zoltan Kubat</span>
      </a>
      <nav class="main-nav">
        <a href="{{ SITEURL }}/">Home</a>
        {% for p in pages|sort(attribute='title') %}
        <a href="{{ SITEURL }}/{{ p.url }}">{{ p.title }}</a>
        {% endfor %}
      </nav>
      <a href="mailto:kubat.zoltan@icloud.com" class="btn btn-sm">Get in touch</a>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <span class="footer-name">Zoltan Kubat</span>
        <span class="footer-role">Senior Product Manager</span>
      </div>
      <div class="footer-links">
        {% for name, url in SOCIAL %}
        <a href="{{ url }}" target="_blank" rel="noopener">{{ name }}</a>
        {% endfor %}
      </div>
      <p class="footer-copy">&copy; {{ AUTHOR }}</p>
    </div>
  </footer>
</body>
</html>
