{% extends "base.html" %}

{% block title %}{{ article.title }} — {{ SITENAME }}{% endblock %}

{% block content %}
<article class="post">
  <h1>{{ article.title }}</h1>
  <time>{{ article.date.strftime('%B %d, %Y') }}</time>
  <div class="content">
    {{ article.content }}
  </div>
</article>
{% endblock %}
